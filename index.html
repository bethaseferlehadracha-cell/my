<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קטלוג הכשרות — בית הספר להדרכה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f30; --bg2:#12163f;
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --br:rgba(255,255,255,.14);
  --br-strong:rgba(255,255,255,.28);
  --ink:#eaedfb; --ink2:#c3cbf0; --eye:#8f9bd6; --silver:#eef1ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Heebo',-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);background:#080a24;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}

#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:860px;margin:0 auto;
  background:radial-gradient(120% 70% at 78% -8%, #262c73 0%, #141850 34%, var(--bg) 70%);overflow:hidden}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 40% at 10% 105%, rgba(120,140,255,.16), transparent 60%);}

/* top bar */
#topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;z-index:20;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:rgba(10,13,44,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.07)}
#topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
#topbar .emb{width:30px;height:30px;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
#topbar .btxt{font-size:13.5px;font-weight:500;letter-spacing:.4px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .grp{display:flex;gap:15px;align-items:center;color:#d3d9f5}
#topbar .ic{width:22px;height:22px;display:block}

/* pages */
#viewport{flex:1 1 auto;overflow:hidden;position:relative;z-index:1}
#track{display:flex;height:100%;transition:transform .4s cubic-bezier(.4,0,.2,1);will-change:transform}
.page{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:22px 18px 30px;scrollbar-width:thin}
.page::-webkit-scrollbar{width:6px}.page::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}

/* bottom nav */
#botnav{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:26px;z-index:20;
  padding:11px;padding-bottom:calc(11px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--ink2);
  background:rgba(10,13,44,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.07)}
#botnav button{padding:5px 8px;border-radius:10px;display:flex;align-items:center}
#botnav button:active{background:rgba(255,255,255,.1)}
#botnav button[disabled]{opacity:.25}
#pgind{min-width:66px;text-align:center;font-weight:500;letter-spacing:.5px}
.nav-ic{width:22px;height:22px;display:block}

/* shared bits */
.eyebrow{font-size:12px;letter-spacing:3px;color:var(--eye);margin-bottom:8px;font-weight:500}
.big-title{font-size:30px;font-weight:800;line-height:1.08;letter-spacing:-.2px}
.rule{height:2px;width:54px;border-radius:2px;margin:14px 0 20px;
  background:linear-gradient(90deg,var(--silver),rgba(238,241,255,0))}
.glass{background:var(--glass);border:1px solid var(--br);border-radius:18px;
  box-shadow:0 8px 26px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.06)}

/* section page */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ccard{background:var(--glass);border:1px solid var(--br);border-radius:18px;padding:15px 14px;cursor:pointer;
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
  box-shadow:0 6px 20px rgba(0,0,0,.28)}
.ccard:active{transform:scale(.975)}
.ccard:hover{border-color:var(--br-strong);background:var(--glass-2)}
.ccard .cic{width:22px;height:22px;color:var(--silver)}
.ccard .cname{font-size:15px;font-weight:500;line-height:1.25;margin:11px 0 11px}
.ccard .cmeta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:10.5px;border:1px solid var(--br-strong);border-radius:20px;padding:3px 10px;color:var(--ink2);white-space:nowrap}
.extras{margin-top:16px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.extra{font-size:14px;color:var(--ink2);padding:9px 4px;display:flex;align-items:center;gap:9px}
.extra .dot{width:5px;height:5px;border-radius:50%;background:var(--eye);flex:0 0 auto}

/* cover */
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:32px}
.cover .emblem{width:180px;height:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.4))}
.cover .ttl{font-size:60px;font-weight:900;line-height:1.0;letter-spacing:.5px;color:#fff}
.cover .sub{font-size:20px;font-weight:400;color:var(--ink2);line-height:1.5}
.cover .eyb{font-size:12px;letter-spacing:5px;color:var(--eye)}

/* toc */
.toc{max-width:600px;margin:0 auto}
.toc-item{display:flex;align-items:baseline;gap:10px;font-size:20px;font-weight:500;padding:13px 6px;cursor:pointer;border-radius:12px;transition:background .15s}
.toc-item:active,.toc-item:hover{background:rgba(255,255,255,.06)}
.toc-item .nm{white-space:nowrap}
.toc-item .dots{flex:1;border-bottom:1.5px dotted rgba(255,255,255,.3);transform:translateY(-5px)}
.toc-item .pg{color:var(--eye);font-weight:400}

/* intro */
.intro{max-width:680px;margin:0 auto;padding:22px;line-height:1.8;font-size:16px}
.intro .quote{text-align:center;font-size:17px;font-weight:500;color:var(--silver);margin-bottom:18px;line-height:1.6}
.intro p{margin:0 0 14px;color:var(--ink2)}
.intro .sign{font-weight:700;text-align:center;margin-top:8px}
.intro .sigb{font-size:12.5px;font-weight:700;color:var(--eye);text-align:center;line-height:1.6;margin-top:18px}

/* tree */
.node{padding:12px 16px;margin:0 auto 10px;max-width:520px;text-align:center}
.node .role{font-weight:700;font-size:16px}
.node .name{font-size:13.5px;color:var(--ink2);margin-top:2px}
.node .tel{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;color:var(--silver);
  background:rgba(255,255,255,.08);border:1px solid var(--br);padding:5px 13px;border-radius:20px;text-decoration:none}
.node .tel .i{width:15px;height:15px}
.gl{text-align:center;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--eye);margin:18px auto 12px;max-width:520px}
.gnodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;max-width:780px;margin:0 auto}
.gnodes .node{margin:0}

/* vision */
.vblock{margin-bottom:22px;max-width:720px;margin-inline:auto}
.vblock h2{text-align:center;font-size:28px;font-weight:800;margin:0 0 6px}
.vblock .vr{height:2px;width:46px;border-radius:2px;margin:0 auto 14px;background:linear-gradient(90deg,var(--silver),rgba(238,241,255,.1))}
.vblock .body{padding:18px 20px;font-size:15px;line-height:1.65;text-align:center;color:var(--ink2)}
.roles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.role-circ{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;background:var(--glass);border:1px solid var(--br-strong);
  box-shadow:0 8px 26px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08)}

/* quads (37 units / sectors) */
.pagetitle{text-align:center;font-size:27px;font-weight:800;margin:2px 0 6px}
.pt-rule{height:2px;width:54px;border-radius:2px;margin:0 auto 20px;background:linear-gradient(90deg,var(--silver),rgba(238,241,255,.1))}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:820px;margin:0 auto}
.quad{overflow:hidden;border-radius:18px}
.quad .qhead{display:flex;align-items:stretch;border-bottom:1px solid var(--br)}
.quad .qhead .qt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;padding:12px 10px;text-align:center}
.quad .qhead.click{cursor:pointer;transition:background .15s}
.quad .qhead.click:hover{background:rgba(255,255,255,.06)}
.quad .qhead.click .qt{color:var(--silver)}
.quad .qhead .qn{display:flex;align-items:center;padding:0 15px;font-weight:800;font-size:15px;color:var(--eye);
  border-inline-start:1px solid var(--br)}
.quad .qhead .qgo{width:16px;height:16px;opacity:.75}
.quad .qbody{padding:13px 15px;text-align:center;font-size:13.5px;line-height:1.75;color:var(--ink2)}
.quad .qbody .grp-t{font-weight:700;color:var(--ink);border-top:1px solid var(--br);margin-top:9px;padding-top:9px}
@media(max-width:560px){.quads{grid-template-columns:1fr}}

/* online section reuses cgrid */
.on-hero{max-width:620px;margin:0 auto}


/* units 37 + sectors redesign */
.units-hero{display:flex;align-items:flex-end;gap:14px;margin-top:2px}
.big37{font-size:72px;font-weight:900;line-height:.82;color:#fff;letter-spacing:-1px}
.units-lead{font-size:22px;font-weight:700;padding-bottom:9px;line-height:1.12}
.catcard,.mcard{padding:15px 16px;margin-bottom:13px;border-radius:18px;max-width:760px;margin-inline:auto}
.mcard{cursor:pointer;transition:border-color .18s,background .18s,transform .18s}
.mcard:hover{border-color:var(--br-strong);background:var(--glass-2)}
.mcard:active{transform:scale(.99)}
.cathead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.catL{display:flex;align-items:center;gap:9px;min-width:0}
.catnum{font-size:13px;font-weight:800;color:var(--eye);flex:0 0 auto}
.cattitle{font-size:16.5px;font-weight:700}
.mcard .catL{color:var(--silver)}
.mcard .catL .cattitle{color:var(--ink)}
.mcard .catL .cic{width:19px;height:19px;flex:0 0 auto}
.mcard .catL .qgo{width:15px;height:15px;opacity:.7;flex:0 0 auto}
.catcount{font-size:12px;font-weight:800;color:#12163f;background:var(--silver);border-radius:20px;padding:3px 11px;flex:0 0 auto}
.uchips{display:flex;flex-wrap:wrap;gap:7px}
.uchip{font-size:11.5px;border:1px solid var(--br-strong);border-radius:16px;padding:4px 11px;color:var(--ink)}
.subl{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--eye);margin:13px 0 7px}
.catbody .subl:first-child{margin-top:0}

/* overlays (drawer / search / filter) */
.overlay{position:absolute;inset:0;z-index:60;display:none}
.overlay.show{display:block}
.ov-scrim{position:absolute;inset:0;background:rgba(6,8,26,.62);backdrop-filter:blur(2px)}
.ov-panel{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(360px,88%);
  background:#0d1138;border-inline-start:1px solid rgba(255,255,255,.1);box-shadow:-8px 0 34px rgba(0,0,0,.5);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .3s ease;padding-top:env(safe-area-inset-top,0px)}
.overlay.show .ov-panel{transform:translateX(0)}
.ov-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--br);flex:0 0 auto}
.ov-head h3{margin:0;font-size:18px;font-weight:700}
.ov-head .x{width:24px;height:24px}
.ov-body{overflow-y:auto;padding:12px 14px 28px;flex:1 1 auto}
.menu-cat{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--eye);margin:16px 4px 4px}
.menu-link{display:flex;justify-content:space-between;gap:10px;padding:11px 8px;font-size:15.5px;border-radius:10px;cursor:pointer}
.menu-link:active,.menu-link:hover{background:rgba(255,255,255,.06)}
.menu-link .pg{color:var(--eye);font-size:13px}
.menu-sub{font-size:13.5px;color:var(--ink2);padding:8px 18px;border-radius:10px;cursor:pointer}
.menu-sub:active,.menu-sub:hover{background:rgba(255,255,255,.05);color:var(--ink)}

.search-input{width:100%;font-size:16px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--br);color:#fff;outline:none}
.search-input::placeholder{color:rgba(255,255,255,.5)}
.search-input:focus{border-color:var(--br-strong)}
.result{padding:12px 10px;border-radius:12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
.result:active,.result:hover{background:rgba(255,255,255,.06)}
.result .rt{font-size:15.5px;font-weight:500}
.result .rm{font-size:12px;color:var(--eye);margin-top:2px}
.result mark{background:var(--silver);color:#12163f;border-radius:3px;padding:0 2px}
.nores{color:var(--ink2);text-align:center;padding:24px;font-size:15px;opacity:.8}
.filt-g{margin-bottom:18px}.filt-g .fl{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:9px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--br);font-size:13px;cursor:pointer}
.fchip.on{background:var(--silver);color:#12163f;border-color:var(--silver);font-weight:500}
.filt-count{font-size:13px;color:var(--eye);margin:4px 0 10px}

/* course detail bottom sheet */
#ovSheet{position:absolute;inset:0;z-index:70;display:none}
#ovSheet.show{display:block}
#ovSheet .ov-scrim{background:rgba(6,8,26,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:860px;margin:0 auto;height:94%;
  background:linear-gradient(180deg,#141a4c,#0c1030);border-radius:26px 26px 0 0;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 -10px 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .34s cubic-bezier(.3,.8,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
#ovSheet.show .sheet{transform:translateY(0)}
.sheet .grab{width:46px;height:4px;border-radius:3px;background:rgba(255,255,255,.3);margin:9px auto 2px;flex:0 0 auto}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px 12px;flex:0 0 auto}
.sheet .stitle{font-size:20px;font-weight:800;line-height:1.15}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);
  border:1px solid var(--br-strong);border-radius:22px;padding:7px 14px;flex:0 0 auto;white-space:nowrap}
.back-btn:active{background:rgba(255,255,255,.08)}
.back-btn .i{width:15px;height:15px}
.sbody{overflow-y:auto;padding:2px 18px 26px;flex:1 1 auto}
.sbody::-webkit-scrollbar{width:6px}.sbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
.icard{background:var(--glass);border:1px solid var(--br);border-radius:16px;padding:14px 15px;margin-bottom:12px}
.icard .il{font-size:11px;letter-spacing:2px;color:var(--eye);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.icard .il .i{width:16px;height:16px}
.icard .ib{font-size:14px;line-height:1.65;color:var(--ink)}
.icard ul{margin:0;padding-inline-start:18px;font-size:13.5px;line-height:1.8;color:var(--ink)}
.smeta{display:flex;gap:10px;margin-bottom:12px}
.smeta .icard{flex:1;margin:0}
.s-banner{font-size:13px;line-height:1.55;color:var(--ink2);text-align:center;padding:12px 14px;margin-bottom:12px}
.stopics-t{text-align:center;font-size:16px;font-weight:700;margin:4px 0 12px}
.schips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.schip{font-size:12.5px;border:1px solid var(--br-strong);border-radius:20px;padding:6px 13px;color:var(--ink)}

/* online sheet body */
.on-card{text-align:center;line-height:1.85;font-size:16px;color:var(--ink)}
.on-card .q{font-weight:500;color:var(--silver)}
.on-card .sp{height:16px}
.linkbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;text-decoration:none;
  background:var(--silver);color:#12163f;font-weight:700;font-size:16px;padding:13px 26px;border-radius:26px;
  box-shadow:0 8px 24px rgba(200,210,255,.25)}
.linkbtn .i{width:20px;height:20px}
</style>
</head>

const LAST=PAGES.length-1;
function pageLabel(i){const p=PAGES[i];
 if(p.type==='cover')return 'בית הספר להדרכה';
 if(p.type==='toc')return 'תוכן עניינים';
 if(p.type==='intro')return 'הקדמה';

 if(p.type==='section')return SECTIONS[p.key].title;
 if(p.type==='online')return 'קורסים מקוונים';
 return '';}
function go(i){cur=Math.max(0,Math.min(LAST,i));
 track.style.transform=`translateX(${cur*100}%)`;
 pgind.textContent = cur===0?'שער':(cur+' / '+LAST);
 barTitle.textContent = cur===0?'בית הספר להדרכה':pageLabel(cur);
 prevBtn.disabled=cur===0; nextBtn.disabled=cur===LAST;
 const vp=track.children[cur]; if(vp)vp.scrollTop=0;
 localStorage.setItem('cat2_page',cur);}
prevBtn.onclick=()=>go(cur-1); nextBtn.onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(document.querySelector('.overlay.show')||document.getElementById('ovSheet').classList.contains('show'))return;
 if(e.key==='ArrowLeft')go(cur+1); if(e.key==='ArrowRight')go(cur-1);});

 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0)go(cur-1);else go(cur+1);}},{passive:true});

 if(!q){sr.innerHTML='<div class="nores">הקלד/י שם קורס, נושא או בעל תפקיד</div>';return;}
 const cr=IDX.filter(x=>x.text.includes(q)), pr=PIDX.filter(x=>x.text.includes(q)&&PAGES[x.i].type!=='section');
 if(!cr.length&&!pr.length){sr.innerHTML='<div class="nores">לא נמצאו תוצאות</div>';return;}
 let html=cr.map(x=>`<div class="result" data-scourse="${x.id}"><div class="rt">${hl(COURSES[x.id].title,q)}</div><div class="rm">קורס · ${esc(COURSES[x.id].group)}</div></div>`).join('');
 html+=pr.map(x=>`<div class="result" data-sgoto="${x.i}"><div class="rt">${hl(pageLabel(x.i),q)}</div><div class="rm">עמוד ${x.i}</div></div>`).join('');
 sr.innerHTML=html;
 sr.querySelectorAll('[data-scourse]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.scourse;const gi=SECTION_INDEX[({מדריכים:'madrichim','קציני הדרכה':'katzinim','רמ״די הדרכה':'ramdim',מפקדים:'mefakdim'})[COURSES[id].group]];closeAll();go(gi);setTimeout(()=>openCourse(id),260);}));
 sr.querySelectorAll('[data-sgoto]').forEach(el=>el.addEventListener('click',()=>{closeAll();go(+el.dataset.sgoto);}));}
si.addEventListener('input',runSearch);
document.getElementById('btnSearch').onclick=()=>{openOv('ovSearch');si.value='';runSearch();setTimeout(()=>si.focus(),260);};

/* filter */
const GROUPS=['מדריכים','קציני הדרכה','רמ״די הדרכה','מפקדים'];
const GKEY={'מדריכים':'madrichim','קציני הדרכה':'katzinim','רמ״די הדרכה':'ramdim','מפקדים':'mefakdim'};
const DUR=['ימים','שבועיים','שבועות'];
let fG=new Set(),fM=null,fD=new Set();
function matchDur(c,k){const d=(c.duration||[]).join(' ');return k==='ימים'?d.includes('ימים'):k==='שבועיים'?d.includes('שבועיים'):d.includes('שבועות');}
function applyFilter(){
 const res=ALLC.filter(({c})=>{
  if(fG.size&&!fG.has(c.group))return false;
  if(fM==='yes'&&c.gamash!==true)return false;
  if(fM==='no'&&c.gamash!==false)return false;
  if(fD.size&&![...fD].some(k=>matchDur(c,k)))return false;return true;});
 document.getElementById('filtCount').textContent=res.length+' קורסים';
 const box=document.getElementById('filtResults');
 box.innerHTML=res.map(({id,c})=>`<div class="result" data-fcourse="${id}"><div class="rt">${esc(c.title)}</div><div class="rm">${esc(c.group)} · ${esc(c.duration.join(' '))}${gmLabel(c.gamash)?' · '+gmLabel(c.gamash):''}</div></div>`).join('')||'<div class="nores">אין קורסים תואמים</div>';
 box.querySelectorAll('[data-fcourse]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.fcourse;const gi=SECTION_INDEX[GKEY[COURSES[id].group]];closeAll();go(gi);setTimeout(()=>openCourse(id),260);}));}
function fchip(l,on){return `<div class="fchip ${on?'on':''}">${esc(l)}</div>`;}
function buildFilter(){const b=document.getElementById('filterBody');
 b.innerHTML=`<div class="filt-g"><div class="fl">מגמה</div><div class="fchips" id="fGE">${GROUPS.map(g=>fchip(g,fG.has(g))).join('')}</div></div>
  <div class="filt-g"><div class="fl">שעות גמו״ש</div><div class="fchips" id="fME">${fchip('מקנה',fM==='yes')}${fchip('לא מקנה',fM==='no')}</div></div>
  <div class="filt-g"><div class="fl">משך</div><div class="fchips" id="fDE">${fchip('ימים',fD.has('ימים'))}${fchip('שבועיים',fD.has('שבועיים'))}${fchip('שבועות',fD.has('שבועות'))}</div></div>
  <div class="filt-count" id="filtCount"></div><div id="filtResults"></div>`;
 b.querySelectorAll('#fGE .fchip').forEach((el,k)=>el.onclick=()=>{const g=GROUPS[k];fG.has(g)?fG.delete(g):fG.add(g);el.classList.toggle('on');applyFilter();});
 const mE=b.querySelectorAll('#fME .fchip');
 mE.forEach((el,k)=>el.onclick=()=>{const v=k===0?'yes':'no';fM=fM===v?null:v;mE.forEach(x=>x.classList.remove('on'));if(fM)mE[fM==='yes'?0:1].classList.add('on');applyFilter();});
 b.querySelectorAll('#fDE .fchip').forEach((el,k)=>el.onclick=()=>{const key=DUR[k];fD.has(key)?fD.delete(key):fD.add(key);el.classList.toggle('on');applyFilter();});
 applyFilter();}
document.getElementById('btnFilter').onclick=()=>{buildFilter();openOv('ovFilter');};

go(cur);
</script>
</body>
</html>
